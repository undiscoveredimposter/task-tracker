<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint under the notch; the safe-area
         insets in index.css then keep content clear of it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="description" content="Tick it off once, everyone knows it is done." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f5fe" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161826" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tally" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS only accepts a PNG here. Given an SVG it silently falls back to a
         screenshot of the page as the home-screen icon. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Tally</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
